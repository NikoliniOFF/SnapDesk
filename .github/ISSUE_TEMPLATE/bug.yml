name: Сообщить о баге
description: Что-то в SnapDesk работает не так
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Спасибо, что сообщаете! Чем подробнее — тем быстрее получится исправить."
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      placeholder: "Например: запись окна получается чёрной"
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Как повторить
      placeholder: "1. …\n2. …"
  - type: input
    id: mode
    attributes:
      label: Что снимали
      description: Область, окно или экран; снимок или запись. Если окно — какая программа.
      placeholder: "Запись окна Chrome, 60 кадров, со звуком системы"
  - type: input
    id: version
    attributes:
      label: Версия SnapDesk
      description: Меню значка в трее → «О программе»
      placeholder: "1.0.0"
  - type: input
    id: windows
    attributes:
      label: Windows, экран и видеокарта
      placeholder: "Windows 11 23H2, два монитора 125% и 100%, NVIDIA RTX 3060"
  - type: textarea
    id: extra
    attributes:
      label: Скриншот или журнал
      description: "Перетащите сюда скриншот. Журнал: запустите `SnapDesk.exe --log`, он появится в `%APPDATA%\\SnapDesk\\SnapDesk.log`."
